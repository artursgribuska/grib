[project]
name = "integrity-analyst"
version = "0.1.0"
description = "Demo: AI compliance analyst for prediction markets (public Polymarket data)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
