name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Install
        run: uv sync --locked
      - name: "Test (offline - no network, no API key needed)"
        run: uv run pytest -q
